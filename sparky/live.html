<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sparky Live (Gemini)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0a1120;color:#cfe8ff;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
  #wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;padding:4vw}
  #orb{width:34vmin;height:34vmin;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5fd0ff,#1366a8 60%,#0a2a44);
       box-shadow:0 0 8vmin rgba(45,212,255,.55);transition:transform .12s ease, box-shadow .2s}
  #orb.talk{animation:pulse .5s infinite alternate}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.07);box-shadow:0 0 12vmin rgba(45,212,255,.85)}}
  #status{font-size:3vmin;min-height:4vh;text-align:center}
  #caption{font-size:2.6vmin;color:#9fd9ff;max-width:80vw;text-align:center;min-height:6vh}
  button{font-size:3.4vmin;padding:1.8vh 6vw;border:none;border-radius:3vmin;cursor:pointer;
         background:#2dd4ff;color:#06131f;font-weight:700;box-shadow:0 0 6vmin rgba(45,212,255,.5)}
  #err{color:#ff8a8a}
</style>
</head>
<body>
  <div id="wrap">
    <div id="orb"></div>
    <div id="status">Pulsa para hablar con Sparky</div>
    <div id="caption"></div>
    <button id="start">▶ Iniciar Sparky Live</button>
  </div>
  <video id="cam" autoplay muted playsinline style="display:none"></video>

<script>
const el = { orb:document.getElementById("orb"), status:document.getElementById("status"),
             cap:document.getElementById("caption"), start:document.getElementById("start"),
             cam:document.getElementById("cam") };
const log = (m) => { fetch("/log?m=" + encodeURIComponent("[live] " + m)).catch(()=>{}); };
const setStatus = (t,err=false) => { el.status.textContent=t; el.status.style.color=err?"#ff8a8a":"#cfe8ff"; log((err?"ERR: ":"")+t); };

const SYS = "Eres Sparky, un asistente físico (un tótem) cálido y natural. VES por una cámara: " +
            "puedes comentar lo que hay frente a ti si te preguntan. Hablas español, breve y conversacional, " +
            "como un humano, no como un robot. No digas que eres un modelo de lenguaje.";

let cfg, ws, micCtx, playCtx, playHead=0, sources=[], camTimer=null;
const b64 = (buf) => { let s=""; const u=new Uint8Array(buf); const C=0x8000;
  for(let i=0;i<u.length;i+=C) s+=String.fromCharCode.apply(null,u.subarray(i,i+C)); return btoa(s); };

el.start.onclick = async () => {
  el.start.disabled = true;
  try {
    cfg = await (await fetch("/live_config",{cache:"no-store"})).json();
    if(!cfg.key){ setStatus("Falta GEMINI_API_KEY en secrets.py",true); return; }
    playCtx = new AudioContext({ sampleRate:24000 });   // salida de Gemini = 24 kHz
    await playCtx.resume();
    connect();
  } catch(e){ setStatus("Error: "+(e&&e.message||e),true); el.start.disabled=false; }
};

function connect(){
  const url = "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=" + cfg.key;
  setStatus("Conectando con Gemini Live…");
  ws = new WebSocket(url);
  ws.onopen = () => {
    ws.send(JSON.stringify({ setup:{
      model: "models/" + cfg.model,
      generationConfig: { responseModalities:["AUDIO"] },
      outputAudioTranscription: {},          // texto de lo que dice (subtítulos)
      systemInstruction: { parts:[{ text: SYS }] },
    }}));
    log("ws abierto, setup enviado");
  };
  ws.onmessage = onMessage;
  ws.onerror = () => log("ws error");
  ws.onclose = (e) => setStatus("Conexión cerrada ("+e.code+"). Si el token expiró, pon una key AIza en secrets.py.", true);
}

async function onMessage(ev){
  const text = (ev.data instanceof Blob) ? await ev.data.text() : ev.data;
  let msg; try { msg = JSON.parse(text); } catch(e){ return; }

  if(msg.setupComplete){ log("setupComplete"); el.start.style.display="none";
    setStatus("🟢 Sparky te escucha — háblale"); startMic(); startCam(); return; }

  const sc = msg.serverContent;
  if(!sc) return;
  if(sc.interrupted){ stopPlayback(); el.orb.classList.remove("talk"); log("interrumpido (barge-in)"); }
  if(sc.outputTranscription && sc.outputTranscription.text){
    el.cap.textContent = (el.cap.textContent + sc.outputTranscription.text).slice(-220);
  }
  const parts = (sc.modelTurn && sc.modelTurn.parts) || [];
  for(const p of parts){ if(p.inlineData && p.inlineData.data) playPCM(p.inlineData.data); }
  if(sc.turnComplete){ el.cap.textContent=""; }
}

// ── Micrófono → PCM 16 kHz → Gemini ──
async function startMic(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1 } });
    micCtx = new AudioContext({ sampleRate:16000 });
    const src = micCtx.createMediaStreamSource(stream);
    const proc = micCtx.createScriptProcessor(4096,1,1);
    const mute = micCtx.createGain(); mute.gain.value = 0;   // no re-emitir el mic por el altavoz
    src.connect(proc); proc.connect(mute); mute.connect(micCtx.destination);
    proc.onaudioprocess = (e) => {
      if(!ws || ws.readyState!==1) return;
      const f = e.inputBuffer.getChannelData(0);
      const i16 = new Int16Array(f.length);
      for(let i=0;i<f.length;i++){ const s=Math.max(-1,Math.min(1,f[i])); i16[i]= s<0 ? s*0x8000 : s*0x7FFF; }
      ws.send(JSON.stringify({ realtimeInput:{ audio:{ data:b64(i16.buffer), mimeType:"audio/pcm;rate=16000" } } }));
    };
    log("micrófono activo (con cancelación de eco)");
  }catch(e){ setStatus("No se pudo abrir el micrófono: "+(e.message||e),true); }
}

// ── Cámara → 1 frame/seg JPEG → Gemini (para que vea el entorno) ──
async function startCam(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ width:640, height:480 } });
    el.cam.srcObject = stream; await el.cam.play();
    const cv = document.createElement("canvas"); cv.width=640; cv.height=480;
    const ctx = cv.getContext("2d");
    camTimer = setInterval(() => {
      if(!ws || ws.readyState!==1) return;
      ctx.drawImage(el.cam,0,0,640,480);
      const jpeg = cv.toDataURL("image/jpeg",0.6).split(",")[1];
      ws.send(JSON.stringify({ realtimeInput:{ video:{ data:jpeg, mimeType:"image/jpeg" } } }));
    }, 1000);
    log("cámara activa (1 frame/seg)");
  }catch(e){ log("cámara no disponible: "+(e.message||e)); }   // sin cámara igual conversa
}

// ── Reproducción del audio de Gemini (24 kHz PCM, en orden) ──
function playPCM(b64data){
  const bin = atob(b64data);
  const u8 = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  const i16 = new Int16Array(u8.buffer);
  const f32 = new Float32Array(i16.length);
  for(let i=0;i<i16.length;i++) f32[i] = i16[i] / 32768;
  const buf = playCtx.createBuffer(1, f32.length, 24000);
  buf.copyToChannel(f32, 0);
  const s = playCtx.createBufferSource(); s.buffer = buf; s.connect(playCtx.destination);
  const now = playCtx.currentTime; if(playHead < now) playHead = now;
  s.start(playHead); playHead += buf.duration; sources.push(s);
  el.orb.classList.add("talk");
  s.onended = () => { sources = sources.filter(x=>x!==s); if(!sources.length) el.orb.classList.remove("talk"); };
}
function stopPlayback(){ sources.forEach(s=>{ try{s.stop()}catch(e){} }); sources=[]; playHead=0; }

// auto-arranque tras un gesto (kiosko: cualquier toque libera el audio)
window.addEventListener("load", () => el.start.click());
["click","touchstart","keydown"].forEach(ev =>
  document.addEventListener(ev, () => { if(playCtx && playCtx.state==="suspended") playCtx.resume(); }));
</script>
</body>
</html>
